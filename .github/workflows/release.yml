name: Release

# Builds rustual-py packages and publishes them to a GitHub release.
#
# Started by `python scripts/release.py release`, which tags vX.Y.Z on main.
# - Tag `v*`: build, smoke-test, then publish the GitHub release, PyPI (rustual-py) and
#   crates.io (rustual-render, rustual-css, rustual). Publishing uses trusted publishing (OIDC),
#   so no tokens are stored; already-published versions are skipped, so re-runs are safe.
# - Run manually (Actions → Release → Run workflow) to build and test without publishing.
#
# Wheels are abi3 (one wheel per platform for CPython 3.10+):
#   manylinux_2_28 x86_64 · musllinux_1_2 x86_64 · Windows x86_64 · macOS universal2 (Intel + Apple silicon)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG_DIR: crates/rustual-py

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 scripts/release.py check

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ env.PKG_DIR }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: ${{ env.PKG_DIR }}/dist

  linux:
    name: Linux (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux_2_28
            manylinux: "2_28"
          - platform: musllinux_1_2
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: ${{ env.PKG_DIR }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: ${{ env.PKG_DIR }}/dist

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          working-directory: ${{ env.PKG_DIR }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-x86_64
          path: ${{ env.PKG_DIR }}/dist

  macos:
    name: macOS (universal2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist
          working-directory: ${{ env.PKG_DIR }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-universal2
          path: ${{ env.PKG_DIR }}/dist

  # Install every wheel on its own platform and run a headless app.
  smoke:
    name: Smoke test (${{ matrix.artifact }}, Python ${{ matrix.python }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: manylinux_2_28, python: "3.10" }
          - { os: ubuntu-latest, artifact: manylinux_2_28, python: "3.14" }
          - { os: windows-latest, artifact: windows-x86_64, python: "3.10" }
          - { os: windows-latest, artifact: windows-x86_64, python: "3.14" }
          - { os: macos-latest, artifact: macos-universal2, python: "3.14" }
          - { os: macos-15-intel, artifact: macos-universal2, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.artifact }}
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-index --find-links dist rustual-py
      # Run from outside the checkout so the installed wheel (not the sources) is imported.
      - run: python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
        working-directory: ${{ runner.temp }}
        shell: bash

  smoke-musl:
    name: Smoke test (musllinux_1_2, Alpine)
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist-musllinux_1_2
          path: dist
      - run: |
          docker run --rm -v "$PWD:/src:ro" python:3.12-alpine sh -c \
            "pip install --no-index --find-links /src/dist rustual-py && cd /tmp && python /src/scripts/smoke_wheel.py"

  release:
    name: Publish GitHub release
    needs: [version, sdist, smoke, smoke-musl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: actions/checkout@v5
        with:
          path: src
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            python3 src/scripts/release.py notes "$TAG"
            cat <<'EOF'

          ### Install

          ```sh
          pip install rustual-py        # Python (Textual-compatible API), CPython 3.10+
          cargo add rustual             # Rust
          ```

          | Wheel | Platform |
          |---|---|
          | `*manylinux_2_28_x86_64.whl` | Linux x86_64 (glibc 2.28+: Debian 10+, Ubuntu 18.10+, RHEL 8+) |
          | `*musllinux_1_2_x86_64.whl` | Linux x86_64 with musl (Alpine 3.13+) |
          | `*win_amd64.whl` | Windows x86_64 |
          | `*universal2.whl` | macOS, Intel and Apple silicon |
          | `*.tar.gz` | Source (needs Rust to build) |

          Every wheel was installed and smoke-tested on its platform before publishing.
          EOF
          } | sed 's/^          //' > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "rustual $TAG" --notes-file notes.md
          fi

  pypi:
    name: Publish to PyPI
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rustual-py/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  crates-io:
    name: Publish to crates.io
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/rustual
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Which crates still need publishing?
        id: pending
        run: |
          version="${GITHUB_REF_NAME#v}"
          pending=""
          for crate in rustual-render rustual-css rustual; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "rustual-release (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$code" = 200 ]; then echo "$crate $version is already on crates.io"; else pending="$pending $crate"; fi
          done
          echo "crates=$pending" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.pending.outputs.crates != ''
        id: auth
      - name: Publish (in dependency order)
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in ${{ steps.pending.outputs.crates }}; do
            cargo publish -p "$crate"
          done
