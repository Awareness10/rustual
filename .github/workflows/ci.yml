name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc (no warnings)
        run: cargo doc --workspace --no-deps --exclude rustual-py
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: crates/rustual-py
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest --cov=rustual --cov-report=term

  coverage:
    name: Coverage & badges
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the badge data to the `badges` branch
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Rust tests with coverage
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --exclude rustual-py --json --summary-only \
            --output-path "$RUNNER_TEMP/rust-cov.json" 2>&1 | tee "$RUNNER_TEMP/rust.log"

      - name: Python tests with coverage
        working-directory: crates/rustual-py
        run: |
          set -o pipefail
          uv sync
          uv run pytest --cov=rustual --cov-report=json:"$RUNNER_TEMP/py-cov.json" -q 2>&1 \
            | tee "$RUNNER_TEMP/py.log"

      - name: Build badge data
        run: |
          python3 scripts/ci_badges.py \
            --rust-log "$RUNNER_TEMP/rust.log" --rust-cov "$RUNNER_TEMP/rust-cov.json" \
            --py-log "$RUNNER_TEMP/py.log" --py-cov "$RUNNER_TEMP/py-cov.json" \
            --out "$RUNNER_TEMP/badges" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish badge data to the `badges` branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ${{ runner.temp }}/badges
        run: |
          cat > README.md <<'MD'
          Badge data for the main README, generated by CI (`scripts/ci_badges.py`) on every push to master.
          Read through https://img.shields.io/endpoint. Do not edit by hand.
          MD
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Badges for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
