[workspace]
resolver = "2"
members = ["crates/rustual-render", "crates/rustual-css", "crates/rustual", "crates/rustual-py"]
# The Python extension is built with maturin (see crates/rustual-py/README.md), not by `cargo test`.
default-members = ["crates/rustual-render", "crates/rustual-css", "crates/rustual"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"
repository = "https://github.com/Awareness10/rustual"
homepage = "https://github.com/Awareness10/rustual"
authors = ["The rustual authors"]

[workspace.dependencies]
rustual-render = { path = "crates/rustual-render", version = "0.6.0" }
rustual-css = { path = "crates/rustual-css", version = "0.6.0" }
unicode-width = "0.2"
unicode-segmentation = "1.12"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
slotmap = "1"
pulldown-cmark = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
