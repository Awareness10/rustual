[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "textual-rs"
description = "A Textual-compatible Python API backed by the textual-rs Rust engine"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
# Rich renderables (Table, Syntax, Panel, ...) in Static / render(); only needed if you use them.
rich = ["rich>=13"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "maturin>=1.8,<2", "rich>=13"]

[tool.maturin]
python-source = "python"
module-name = "textual_rs._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
