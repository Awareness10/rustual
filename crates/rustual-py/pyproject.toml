[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rustual-py"
description = "A Textual-compatible Python API backed by the rustual Rust engine"
version = "0.6.1.dev0"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.scripts]
# `uvx rustual-py` runs the example launcher without installing anything.
rustual-py = "rustual.cli:main"

[project.optional-dependencies]
# Rich renderables (Table, Syntax, Panel, ...) in Static / render(); only needed if you use them.
rich = ["rich>=13", "pytest-cov>=5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "maturin>=1.8,<2", "rich>=13", "pytest-cov>=5"]

[tool.maturin]
python-source = "python"
module-name = "rustual._native"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
