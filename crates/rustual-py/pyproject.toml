[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rustual-py"
description = "A Textual-compatible Python API backed by the rustual Rust engine"
version = "0.7.1.dev0"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.scripts]
# `uvx rustual-py` runs the example launcher without installing anything.
rustual-py = "rustual.cli:main"

[project.optional-dependencies]
# Rich renderables (Table, Syntax, Panel, ...) in Static / render(); only needed if you use them.
rich = ["rich>=13"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "maturin>=1.8,<2",
    "rich>=13",
    "pytest-cov>=5",
    { include-group = "lint" },
]
# CI runs it with `uv run --only-group lint`, which doesn't build the extension.
lint = ["ruff==0.17.1"]

[tool.maturin]
python-source = "python"
module-name = "rustual._native"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Ruff checks every Python file in the repository: run it from this directory with
# `uv run ruff check --fix . ../../scripts` (and `ruff format` with the same paths);
# files outside this directory use these settings too, since they have none of their own.
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "RUF012", # `BINDINGS = [...]`, `CSS`, ...: plain class attributes in Textual's API
    "RUF001", # box drawing and other non-ASCII characters are intended in a TUI library
    "RUF002",
    "RUF003",
    "B027",   # Textual's optional hooks (e.g. `Provider.startup`) are empty, not abstract
]

[tool.ruff.lint.isort]
known-first-party = ["rustual"]
# tests/live_json: the Textual and rustual versions must differ only in their imports.
known-local-folder = ["feed"]
