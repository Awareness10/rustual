[package]
name = "rustual"
description = "A Rust re-creation of Python's Textual TUI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tui", "terminal", "textual", "widgets", "css"]
categories = ["command-line-interface", "gui"]

[dependencies]
rustual-render.workspace = true
rustual-css.workspace = true
crossterm.workspace = true
tokio.workspace = true
futures.workspace = true
slotmap.workspace = true
unicode-width.workspace = true
pulldown-cmark.workspace = true
chrono.workspace = true
regex.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "net", "io-util"] }
serde_json = "1"

# Realistic example apps: their in-file tests run with `cargo test`.
[[example]]
name = "tasks"
test = true

[[example]]
name = "monitor"
test = true

[[example]]
name = "chat"
test = true

[[example]]
name = "live_json"
test = true
